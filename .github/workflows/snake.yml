name: Generate Snake

on:
  # Generate the snake every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Also generate it when main is updated
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    # Allow the workflow to publish generated files
    permissions:
      contents: write

    steps:
      # Generate the contribution snake SVG files
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mrvarunk
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publish the files to the output branch
      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
